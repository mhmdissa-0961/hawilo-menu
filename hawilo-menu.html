  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){

  }
  body{
    margin:0;

  .ar{ font-family:'Cairo', sans-serif; direction:rtl; unicode-bidi:isolate; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    color:#fff;
    background:#1B1714;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    filter:saturate(1.05);
  }
  .hero-scrim{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(15,12,10,.55) 0%, rgba(15,12,10,.72) 55%, rgba(15,12,10,.94) 100%);
  }
  .hero-inner{
    position:relative;
    max-width:var(--maxw);
    margin:0 auto;
    padding:56px 24px 40px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:18px;
  }
  .hero-logo{
    width:78px; height:78px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid rgba(255,255,255,.85);
    box-shadow:0 8px 20px rgba(0,0,0,.35);
  }
  .hero h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:clamp(2.4rem, 6vw, 3.6rem);
    letter-spacing:.01em;
    margin:0;
    line-height:1.02;
  }
  .hero-tagline{
    font-size:1.05rem;
    color:#EFE6D4;
    margin:0;
  }
  .hero-tagline .ar{ font-size:1.05rem; color:#EFE6D4; }
  .hero-meta{
    display:flex;
    flex-wrap:wrap;
    gap:10px 22px;
    margin-top:6px;
    font-size:.95rem;
    color:#D8CDB9;
  }
  .hero-meta a{ text-decoration:none; }
  .hero-meta a:hover{ color:#fff; }
  .hero-cta{
    margin-top:6px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--ember);
    color:#fff;
    text-decoration:none;
    font-weight:600;
    font-size:.95rem;
    padding:12px 22px;
    border-radius:999px;
    transition:background .18s ease, transform .18s ease;
  }
  .hero-cta:hover{ background:var(--ember-dark); transform:translateY(-1px); }

  /* ---------- Sticky nav ---------- */
  .catnav-wrap{
    position:sticky; top:0; z-index:40;
    background:var(--cream);
    border-bottom:1px solid var(--line);
  }
  .catnav{
    max-width:var(--maxw);
    margin:0 auto;
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:12px 24px;
    scrollbar-width:none;
  }

  .catpill{
    flex:0 0 auto;

    align-items:center;
    gap:8px;
    padding:9px 16px;
    border-radius:999px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:.88rem;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    transition:background .16s ease, color .16s ease, border-color .16s ease;
  }

  .catpill:hover{ border-color:var(--ember); color:var(--ink); }
  .catpill.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  /* ---------- Sections ---------- */
  main{ max-width:var(--maxw); margin:0 auto; padding:8px 24px 60px; }
  .category-section{ padding-top:46px; scroll-margin-top:66px; }
  .category-head{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
    padding-bottom:12px;
    border-bottom:2px solid var(--ink);
  }

    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:1.55rem;
    margin:0;
    color:var(--ink);
  }
  .category-head .ar{ font-size:1.1rem; color:var(--ink-soft); font-weight:600; }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:20px;
  }
  .card{
    background:var(--cream-card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease, transform .5s ease;
  }
  .card.in-view{ opacity:1; transform:translateY(0); }
  .card-media{
    position:relative;
    aspect-ratio:4/3;
    overflow:hidden;
    background:#EDE4D2;
  }
  .card-media img{
    width:100%; height:100%; object-fit:cover;
    transition:transform .5s ease;
  }
  .card:hover .card-media img{ transform:scale(1.06); }
  .card-price{
    position:absolute; right:10px; bottom:10px;
    background:var(--ink);
    color:#fff;
    font-weight:700;
    font-size:.82rem;
    letter-spacing:.02em;
    padding:6px 12px;
    border-radius:999px;

  .card-body{ padding:16px 16px 18px; }
  .card-body h3{
    font-family:'Oswald', sans-serif;
    font-weight:500;
    font-size:1.08rem;
    margin:0 0 6px;
    color:var(--ink);
  }
  .card-body p{
    margin:0;
    font-size:.88rem;
    color:var(--ink-soft);
    line-height:1.5;
  }

  .card.no-image{ display:flex; flex-direction:column; }
  .card-price-inline{
    display:inline-block;
    margin-top:10px;

  pill.href = `#${cat.id}`;
  pill.className = 'catpill';
  pill.dataset.target = cat.id;
  pill.innerHTML = `<img src="${cat.icon}" alt="">${cat.title}`;
  navEl.appendChild(pill);

  // section
  const section = document.createElement('section');
  section.className = 'category-section';
  section.id = cat.id;

  const head = document.createElement('div');
  head.className = 'category-head';
  head.innerHTML = `<img src="${cat.icon}" alt=""><h2>${cat.title}</h2><span class="ar">${cat.ar}</span>`;
  section.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';

  cat.items.forEach(item => {
    const card = document.createElement('article');
    card.className = item.img ? 'card' : 'card no-image';

    const nameLine = item.nameAr
      ? `${item.name} <span class="ar" style="font-size:.82em; color:var(--ink-soft); font-weight:600;">${item.nameAr}</span>`
      : item.name;

    if (item.img) {
      card.innerHTML = `
        <div class="card-media">
          <img src="${IMG_BASE}${item.img}" alt="${item.name}" loading="lazy">
          <span class="card-price">${item.price}</span>
        </div>
        <div class="card-body">
          <h3>${nameLine}</h3>
          ${item.desc ? `<p>${item.desc}</p>` : ''}
        </div>`;
    } else {
      card.innerHTML = `
        <div class="card-body">
          <h3>${nameLine}</h3>
          ${item.desc ? `<p>${item.desc}</p>` : ''}
          <span class="card-price-inline">${item.price}</span>
        </div>`;
    }
    grid.appendChild(card);
  });

  section.appendChild(grid);
  mainEl.appendChild(section);
});

// active nav highlight + fade-in cards
const pills = Array.from(document.querySelectorAll('.catpill'));
const sections = Array.from(document.querySelectorAll('.category-section'));
const cards = Array.from(document.querySelectorAll('.card'));

const cardObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in-view'); cardObserver.unobserve(e.target); } });
}, { threshold: 0.12 });
cards.forEach(c => cardObserver.observe(c));

const navObserver = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      pills.forEach(p => p.classList.toggle('active', p.dataset.target === e.target.id));
    }
  });
}, { rootMargin: '-45% 0px -50% 0px', threshold: 0 });
sections.forEach(s => navObserver.observe(s));
</script>
